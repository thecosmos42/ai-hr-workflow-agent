[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onboard-pilot"
version = "0.1.0"
description = "HR new-hire onboarding agent with LangGraph"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.32.0",
    "chromadb>=0.5.0",
    "email-validator>=2.0.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.1.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["onboard_pilot"]

[tool.setuptools.package-dir]
onboard_pilot = "src/onboard_pilot"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"
